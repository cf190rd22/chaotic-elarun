<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="color-scheme" content="dark">
<title>Encounter Roller</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#161b27;--surface-2:#1c2236;--surface-3:#181e2e;
  --border:#252d3f;--border-light:#1e2538;
  --text:#e8eaf0;--text-2:#9aa3b8;--text-mute:#8b96b3;
  --accent:#5b8ef0;--accent-dim:rgba(91,142,240,.10);--accent-bd:rgba(91,142,240,.35);
  --amber:#f0b96b;--amber-dim:rgba(240,185,107,.10);--amber-bd:rgba(240,185,107,.32);
  --red:#f07070;--red-dim:rgba(240,112,112,.10);--red-bd:rgba(240,112,112,.32);
  --green:#6bcb8b;--green-dim:rgba(107,203,139,.10);--green-bd:rgba(107,203,139,.32);
  --teal:#6bcbcb;--teal-dim:rgba(107,203,203,.10);--teal-bd:rgba(107,203,203,.32);
  --purple:#b48af7;--purple-dim:rgba(180,138,247,.10);--purple-bd:rgba(180,138,247,.32);
  --orange:#f07b3a;--orange-dim:rgba(240,123,58,.10);--orange-bd:rgba(240,123,58,.32);
  color-scheme:dark;
}
*{box-sizing:border-box;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
html,body{height:100%;margin:0;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;}
button,input,select,textarea{font-family:inherit;color:inherit;}
select,option{background:var(--surface-2);color:var(--text);}
.mono{font-family:'DM Mono','SFMono-Regular',Consolas,monospace;}

.app{height:100%;display:flex;flex-direction:column;}

/* ---------- topbar ---------- */
.topbar{height:54px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--bg);}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:8px;}
.brand svg{color:var(--accent);}
.brand .sub{color:var(--text-mute);font-weight:500;font-size:11px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;padding-left:8px;border-left:1px solid var(--border);}
.drawer-btn{display:none;background:none;border:1px solid var(--border);border-radius:7px;color:var(--text-2);width:32px;height:32px;align-items:center;justify-content:center;cursor:pointer;}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0;}
.seg button{padding:6px 12px;font-size:10.5px;font-weight:700;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.06em;background:var(--surface);color:var(--text-mute);border:none;cursor:pointer;}
.seg button+button{border-left:1px solid var(--border);}
.seg button:hover{color:var(--text);}
.seg button[data-mode=normal].active{background:var(--accent-dim);color:var(--accent);}
.seg button[data-mode=adv].active{background:var(--green-dim);color:var(--green);}
.seg button[data-mode=disadv].active{background:var(--red-dim);color:var(--red);}
.topbar-spacer{flex:1;}
.iconbtn{background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text-2);height:32px;padding:0 11px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;cursor:pointer;}
.iconbtn:hover{background:var(--surface-2);color:var(--text);}
.iconbtn.primary{background:var(--accent-dim);border-color:var(--accent-bd);color:var(--accent);}
.iconbtn.primary:hover{background:rgba(91,142,240,.18);}

/* ---------- layout ---------- */
.layout{flex:1;display:flex;min-height:0;overflow:hidden;position:relative;}
.scrim{position:fixed;inset:0;background:rgba(5,7,12,.6);z-index:35;display:none;}
.scrim.show{display:block;}

/* ---------- library ---------- */
.library{width:262px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.library-hdr{padding:12px;border-bottom:1px solid var(--border-light);display:flex;flex-direction:column;gap:8px;flex-shrink:0;}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-mute);pointer-events:none;}
#searchInput{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 10px 7px 30px;font-size:12.5px;outline:none;}
#searchInput:focus{border-color:var(--accent-bd);}
.lib-list{flex:1;overflow-y:auto;}
.lib-empty{padding:16px 14px;color:var(--text-mute);font-size:12px;line-height:1.6;}
.lib-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border-light);}
.lib-item:hover{background:var(--surface-2);}
.lib-item-body{flex:1;min-width:0;cursor:pointer;}
.lib-item-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lib-item-meta{font-size:10px;color:var(--text-mute);font-family:'DM Mono',monospace;margin-top:1px;}
.icobtn{background:none;border:none;cursor:pointer;color:var(--text-mute);padding:3px;display:flex;border-radius:5px;}
.icobtn:hover{color:var(--text);background:var(--surface-3);}
.star-btn.active{color:var(--amber);}
.trash-btn:hover{color:var(--red);}

/* ---------- board ---------- */
.board{flex:1;overflow:auto;padding:16px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:14px;}
.board-empty{margin:60px auto;color:var(--text-mute);text-align:center;max-width:300px;font-size:12.5px;line-height:1.7;}
.board-empty b{color:var(--text-2);}

.card{width:322px;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;align-self:flex-start;}
.card-hdr{padding:11px 13px 12px;border-bottom:1px solid var(--border-light);}
.card-title-row{display:flex;align-items:center;gap:6px;}
.card-name{font-size:15px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-pills{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;align-items:center;}
.pill{font-size:10px;font-family:'DM Mono',monospace;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);white-space:nowrap;}
.count-stepper{display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:2px;margin-left:auto;}
.count-stepper button{width:19px;height:19px;border:none;background:none;color:var(--text-2);cursor:pointer;font-size:13px;line-height:1;border-radius:4px;}
.count-stepper button:hover{background:var(--surface-3);color:var(--text);}
.count-stepper span{font-family:'DM Mono',monospace;font-weight:700;font-size:11.5px;min-width:14px;text-align:center;}
.count-lbl{font-size:9px;color:var(--text-mute);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.06em;margin-left:5px;}

.saves-row{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:9px 13px;border-bottom:1px solid var(--border-light);}
.save-btn{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:4px 0 3px;cursor:pointer;}
.save-btn:hover{border-color:var(--purple-bd);}
.save-btn:hover .val{color:var(--purple);}
.save-btn .lbl{font-size:7.5px;font-family:'DM Mono',monospace;letter-spacing:.08em;color:var(--text-mute);}
.save-btn .val{font-size:12px;font-weight:700;font-family:'DM Mono',monospace;color:var(--text-2);}

.group{border-bottom:1px solid var(--border-light);}
.group:last-child{border-bottom:none;}
.group-hdr{padding:8px 13px;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-family:'DM Mono',monospace;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text-mute);user-select:none;}
.group-hdr:hover{color:var(--text-2);}
.group-hdr .swatch{width:6px;height:6px;border-radius:2px;flex-shrink:0;}
.group-hdr .chev{margin-left:auto;transition:transform .15s;color:var(--text-mute);}
.group.collapsed .chev{transform:rotate(-90deg);}
.group.collapsed .group-body{display:none;}
.group-body{padding:0 13px 8px;}
.entry{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--border-light);}
.entry:first-child{border-top:none;}
.entry-main{flex:1;min-width:0;}
.entry-name{font-size:12.5px;font-weight:600;}
.entry-tag{font-size:10px;color:var(--text-mute);font-family:'DM Mono',monospace;margin-top:1px;}
.trait-row{padding:7px 0;border-top:1px solid var(--border-light);font-size:11.5px;color:var(--text-2);line-height:1.55;}
.trait-row:first-child{border-top:none;}
.trait-row b{color:var(--text);}
.roll-btn{display:flex;align-items:center;gap:5px;background:var(--accent-dim);border:1px solid var(--accent-bd);color:var(--accent);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.roll-btn:hover{filter:brightness(1.25);}
.roll-btn.bonus{background:var(--amber-dim);border-color:var(--amber-bd);color:var(--amber);}
.roll-btn.reaction{background:var(--red-dim);border-color:var(--red-bd);color:var(--red);}
.roll-btn.legendary{background:var(--purple-dim);border-color:var(--purple-bd);color:var(--purple);}
.roll-btn.multi{background:var(--orange-dim);border-color:var(--orange-bd);color:var(--orange);}
.g-action .swatch{background:var(--accent);}
.g-bonus .swatch{background:var(--amber);}
.g-reaction .swatch{background:var(--red);}
.g-legendary .swatch{background:var(--purple);}
.g-trait .swatch{background:var(--teal);}
.card-ft{padding:9px 13px;display:flex;justify-content:flex-end;}
.ft-link{background:none;border:none;color:var(--text-mute);font-size:10.5px;cursor:pointer;display:flex;align-items:center;gap:4px;}
.ft-link:hover{color:var(--red);}

/* ---------- log panel ---------- */
.logpanel{width:298px;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.log-hdr{padding:12px 14px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.log-hdr-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-mute);font-family:'DM Mono',monospace;}
.log-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column-reverse;gap:8px;}
.log-empty{margin:auto;color:var(--text-mute);font-size:12px;text-align:center;padding:20px;line-height:1.6;}
.log-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:9px 11px;}
.log-card.bonus{border-left-color:var(--amber);}
.log-card.reaction{border-left-color:var(--red);}
.log-card.legendary{border-left-color:var(--purple);}
.log-card.throw{border-left-color:var(--teal);}
.log-card.multi{border-left-color:var(--orange);}
.log-card-hdr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px;}
.log-card-hdr .lname{font-size:11.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.log-card-hdr .lwho{font-size:9.5px;color:var(--text-mute);font-family:'DM Mono',monospace;white-space:nowrap;}
.log-inst{font-size:11.5px;font-family:'DM Mono',monospace;padding:4px 0;border-top:1px dashed var(--border-light);line-height:1.5;}
.log-inst:first-child{border-top:none;}
.log-inst .idx{color:var(--text-mute);}
.crit{color:var(--amber);font-weight:700;}
.fumble{color:var(--red);font-weight:700;}
.dmg-total{color:var(--orange);font-weight:700;}
.dmg-half{color:var(--green);}
.sub-line{padding-left:10px;color:var(--text-2);}

/* ---------- modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(5,7,12,.72);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;}
.modal-hdr{padding:15px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-hdr h2{margin:0;font-size:15px;}
.modal-body{padding:18px 20px;overflow-y:auto;flex:1;}
.modal-ft{padding:13px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
textarea.paste{width:100%;min-height:230px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:'DM Mono',monospace;font-size:11.5px;resize:vertical;outline:none;}
textarea.paste:focus{border-color:var(--accent-bd);}
.hint{font-size:11.5px;color:var(--text-mute);line-height:1.6;margin-bottom:10px;}
.field-row{display:flex;gap:8px;margin-bottom:8px;}
.field{flex:1;display:flex;flex-direction:column;gap:3px;}
.field label{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-mute);font-family:'DM Mono',monospace;}
.field input,.field select{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12.5px;outline:none;}
.field input:focus,.field select:focus{border-color:var(--accent-bd);}
.abil-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px;}
.abil-col{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px;text-align:center;}
.abil-col .albl{font-size:9px;font-family:'DM Mono',monospace;color:var(--text-mute);letter-spacing:.06em;}
.abil-col input{width:100%;background:var(--surface-3);border:1px solid var(--border);border-radius:4px;text-align:center;margin-top:3px;padding:3px 0;font-size:11.5px;font-family:'DM Mono',monospace;}
.abil-col .savelbl{font-size:8px;color:var(--text-mute);margin-top:4px;}
.sec-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-mute);font-family:'DM Mono',monospace;margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between;}
.entry-edit{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px;margin-bottom:8px;}
.ee-row1{display:flex;gap:6px;margin-bottom:7px;}
.ee-row1 input.ee-name{flex:1;min-width:0;}
.ee-row1 select{flex-shrink:0;}
.ee-row1 input,.ee-row1 select{background:var(--surface-3);border:1px solid var(--border);border-radius:6px;padding:6px 7px;font-size:12px;outline:none;}
.ee-kindfields{display:flex;flex-direction:column;gap:6px;margin-bottom:6px;}
.ee-inline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.ee-inline input,.ee-inline select{background:var(--surface-3);border:1px solid var(--border);border-radius:6px;padding:5px 7px;font-size:11.5px;outline:none;}
.ee-inline input.dice{width:90px;}
.ee-inline input.dtype{width:110px;}
.ee-inline input.dc{width:56px;}
.ee-inline label.chk{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-2);}
textarea.ee-text{width:100%;min-height:44px;background:var(--surface-3);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:11px;color:var(--text-2);resize:vertical;outline:none;}
.smallbtn{background:var(--surface-3);border:1px solid var(--border);border-radius:6px;color:var(--text-2);font-size:10.5px;padding:4px 8px;cursor:pointer;font-weight:600;}
.smallbtn:hover{color:var(--text);border-color:var(--accent-bd);}
.iconx{background:none;border:none;color:var(--text-mute);cursor:pointer;padding:3px;display:flex;flex-shrink:0;}
.iconx:hover{color:var(--red);}
.btn{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-2);}
.btn:hover{background:var(--surface-3);color:var(--text);}
.btn.primary{background:var(--accent-dim);border-color:var(--accent-bd);color:var(--accent);}
.btn.primary:hover{background:rgba(91,142,240,.2);}
.parsed-name-banner{background:var(--green-dim);border:1px solid var(--green-bd);color:var(--green);border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:14px;}

@media(max-width:900px){
  .drawer-btn{display:inline-flex;}
  .library{position:fixed;left:0;top:54px;bottom:0;width:80vw;max-width:300px;transform:translateX(-101%);transition:transform .2s ease;z-index:40;}
  .library.open{transform:translateX(0);}
  .logpanel{position:fixed;right:0;top:54px;bottom:0;width:80vw;max-width:320px;transform:translateX(101%);transition:transform .2s ease;z-index:40;}
  .logpanel.open{transform:translateX(0);}
  .card{width:100%;}
  .brand .sub{display:none;}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="drawer-btn" data-act="toggle-sidebar" title="Creature library" aria-label="Toggle library">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 3 7.5v9L12 22l9-5.5v-9L12 2Z"/><path d="M12 2v20M3 7.5l9 5.5 9-5.5M3 16.5l9-5.5 9 5.5"/></svg>
      Encounter Roller
      <span class="sub">DM combat dice</span>
    </div>
    <div class="topbar-spacer"></div>
    <div class="seg" id="rollModeSeg">
      <button data-mode="disadv">Disadv</button>
      <button data-mode="normal" class="active">Normal</button>
      <button data-mode="adv">Adv</button>
    </div>
    <button class="iconbtn" data-act="clear-log" title="Clear roll log">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
      Clear log
    </button>
    <button class="drawer-btn" data-act="toggle-logpanel" title="Roll log" aria-label="Toggle log">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 0 1 2-2h8l6 6v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 3v6h6"/></svg>
    </button>
  </div>

  <div class="layout">
    <div class="scrim" id="scrim"></div>

    <aside class="library" id="libraryPanel">
      <div class="library-hdr">
        <button class="iconbtn primary" data-act="open-add-modal" style="justify-content:center;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add creature
        </button>
        <div class="search-wrap">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="searchInput" placeholder="Search library…" autocomplete="off">
        </div>
      </div>
      <div class="lib-list" id="libList"></div>
    </aside>

    <main class="board" id="board"></main>

    <aside class="logpanel" id="logPanel">
      <div class="log-hdr">
        <span class="log-hdr-title">Roll log</span>
      </div>
      <div class="log-list" id="logList"></div>
    </aside>
  </div>
</div>

<div id="modalRoot"></div>

<script>
'use strict';

/* ============================== constants ============================== */
const ABILS = ['str','dex','con','int','wis','cha'];
const ABIL_FULL = {str:'Strength',dex:'Dexterity',con:'Constitution',int:'Intelligence',wis:'Wisdom',cha:'Charisma'};
const ATYPE_LABEL = {action:'Actions',bonus:'Bonus Actions',reaction:'Reactions',legendary:'Legendary Actions',trait:'Traits'};
const ATYPE_ORDER = ['action','bonus','reaction','legendary','trait'];
const NUM_WORD = {one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};

/* ============================== utilities ============================== */
function uid(p){ return p+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMod(n){ n = n||0; return (n>=0?'+':'')+n; }
function clamp(n,lo,hi){ return Math.max(lo,Math.min(hi,n)); }
function signedInt(s){ return parseInt(String(s).replace(/[−–—]/g,'-').replace(/\s+/g,''),10); }
function rollDie(sides){ return 1+Math.floor(Math.random()*sides); }

function parseDice(expr){
  if(!expr) return null;
  const m = /(\d+)\s*d\s*(\d+)\s*(?:([+\-−])\s*(\d+))?/i.exec(expr);
  if(m){
    const bonus = m[4] ? (m[3]==='-'||m[3]==='−' ? -(+m[4]) : +m[4]) : 0;
    return { count:+m[1], sides:+m[2], bonus };
  }
  const flatM = /^\s*(\d+)\s*$/.exec(expr);
  if(flatM) return { count:0, sides:0, bonus:+flatM[1] };
  return null;
}

function rollD20(mode){
  const r1 = rollDie(20);
  if(mode==='normal') return { rolls:[r1], chosen:r1 };
  const r2 = rollDie(20);
  const chosen = mode==='adv' ? Math.max(r1,r2) : Math.min(r1,r2);
  return { rolls:[r1,r2], chosen };
}

function rollDamage(comp, crit){
  const parsed = parseDice(comp.dice);
  if(!parsed) return { total:0, rolls:[], bonus:0, sides:0, type:comp.type||'' };
  const count = parsed.count * (crit?2:1);
  const rolls = [];
  let sum = 0;
  for(let i=0;i<count;i++){ const r = rollDie(parsed.sides); rolls.push(r); sum += r; }
  return { total: sum+parsed.bonus, rolls, bonus:parsed.bonus, sides:parsed.sides, type:comp.type||'' };
}

/* ============================== parser ============================== */
function extractName(flat, lines, isHtml, raw){
  if(isHtml){
    try{
      const div = document.createElement('div');
      div.innerHTML = raw;
      const h = div.querySelector('h1,h2,h3');
      if(h && h.textContent.trim()) return h.textContent.trim().replace(/\s+/g,' ');
    }catch(e){}
  }
  for(const l of lines){
    const c = l.replace(/^✦\s*/,'').trim();
    if(!c) continue;
    if(/^(armor class|ac\b|hit points|hp\b|speed|str\b|dex\b|con\b|int\b|wis\b|cha\b|saving throws?|skills|senses|languages|challenge|actions|bonus actions|reactions|traits|legendary actions)/i.test(c)) break;
    return c.replace(/[.:]+$/,'').slice(0,60);
  }
  return 'Unnamed Creature';
}

function matchNum(text, re){ const m = re.exec(text); return m ? +m[1] : null; }

const META_LINE_RE = /^(Skills|Senses|Languages|Damage\s+\w+|Condition\s+Immunities|Saving\s+Throws?|Proficiency\s+Bonus|Gear|Challenge|Armor\s+Class|Hit\s+Points|Speed)\b/i;

function extractAbilities(flat){
  const abilities = {};
  // Layout A: a header row (STR DEX CON INT WIS CHA) followed by a value row - common in table-based statblocks.
  const headerRe = /\bSTR\b[\s\S]{0,10}?\bDEX\b[\s\S]{0,10}?\bCON\b[\s\S]{0,10}?\bINT\b[\s\S]{0,10}?\bWIS\b[\s\S]{0,10}?\bCHA\b/i;
  const hm = headerRe.exec(flat);
  if(hm){
    const after = flat.slice(hm.index + hm[0].length, hm.index + hm[0].length + 400);
    const scoreRe = /(\d{1,2})\s*\(\s*([+\-−]\s*\d+)\s*\)/g;
    const found = [];
    let sm;
    while(found.length < 6 && (sm = scoreRe.exec(after))) found.push({ score:+sm[1], mod: signedInt(sm[2]) });
    if(found.length === 6) ABILS.forEach((k,i)=> abilities[k] = found[i]);
  }
  // Layout B: each ability code sits close to its own "NN (+/-N)" - covers inline and per-column layouts.
  if(Object.keys(abilities).length < 6){
    const abilRe = /\b(STR|DEX|CON|INT|WIS|CHA)\b[\s\S]{0,20}?(\d{1,2})\s*\(\s*([+\-−]\s*\d+)\s*\)/gi;
    let am;
    while((am = abilRe.exec(flat))){
      const key = am[1].toLowerCase();
      if(!abilities[key]) abilities[key] = { score:+am[2], mod: signedInt(am[3]) };
    }
  }
  ABILS.forEach(k=>{ if(!abilities[k]) abilities[k] = { score:10, mod:0 }; });
  return abilities;
}

function buildEntry(re){
  const body = re.body || '';
  const id = uid('e');
  const nameLower = re.name.toLowerCase().trim();
  const entry = { id, name: re.name.trim(), atype: re.section, kind:'other', dmg:[], text: body.trim() };

  const toHitM = /(?:Melee|Ranged|Melee or Ranged)(?:\s+Weapon)?\s+Attack(?:\s+Roll)?:?\s*\+\s*(\d+)/i.exec(body);
  const dmgParts = [];
  const dmgRe = /(\d+)\s*\(\s*([0-9dD+\-−\s]+?)\s*\)\s*([A-Za-z]+)\s+damage/gi;
  let dm;
  while((dm = dmgRe.exec(body))){
    dmgParts.push({ dice: dm[2].replace(/\s+/g,'').replace(/−/g,'-'), type: dm[3].toLowerCase() });
  }
  if(!dmgParts.length){
    const flatRe = /\b(\d+)\s+([A-Za-z]+)\s+damage/gi;
    let fm;
    while((fm = flatRe.exec(body))) dmgParts.push({ dice: fm[1], type: fm[2].toLowerCase() });
  }
  const saveM = /DC\s*(\d+)\s*(Strength|Dexterity|Constitution|Intelligence|Wisdom|Charisma|Str|Dex|Con|Int|Wis|Cha)\w*[\s\S]{0,25}?(?:saving throw|save)/i.exec(body);
  const half = /half(?:\s+as\s+much)?\s+damage/i.test(body);

  if(toHitM){
    entry.kind = 'attack';
    entry.toHit = +toHitM[1];
    entry.dmg = dmgParts;
    if(saveM) entry.extraSave = { dc:+saveM[1], ability: saveM[2].slice(0,3).toUpperCase() };
  } else if(saveM){
    entry.kind = 'save';
    entry.save = { dc:+saveM[1], ability: saveM[2].slice(0,3).toUpperCase(), half };
    entry.dmg = dmgParts;
  } else if(nameLower === 'multiattack'){
    entry.kind = 'multi';
    entry.multi = [];
    entry._multiText = body;
  } else {
    entry.kind = 'other';
  }
  return entry;
}

function linkMultiattacks(entries){
  const attackEntries = entries.filter(e=>e.kind==='attack');
  entries.forEach(e=>{
    if(e.kind!=='multi' || !e._multiText) return;
    const parts = [];
    const re = /\b(one|two|three|four|five|six|seven|eight|nine|ten|\d+)\b\s+([A-Za-z][A-Za-z '\-]{1,30}?)\s+attacks?\b/gi;
    let m;
    while((m = re.exec(e._multiText))){
      const count = NUM_WORD[m[1].toLowerCase()] ?? parseInt(m[1],10);
      const label = m[2].trim().toLowerCase();
      const match = attackEntries.find(a=> label.includes(a.name.toLowerCase()) || a.name.toLowerCase().includes(label));
      if(match && !parts.find(p=>p.ref===match.id)) parts.push({ ref: match.id, count });
    }
    e.multi = parts;
    delete e._multiText;
  });
}

function parseStatblock(raw){
  const isHtml = /<[a-z][\s\S]*>/i.test(raw.trim());
  let text;
  if(isHtml){
    const div = document.createElement('div');
    div.innerHTML = raw;
    div.querySelectorAll('b,strong').forEach(el=>{
      const t = el.textContent.trim();
      if(/[A-Za-z]/.test(t) && /\.\s*$/.test(t) && t.length<=60){
        el.insertAdjacentText('beforebegin','✦');
      }
    });
    div.querySelectorAll('p,div,tr,td,th,li,h1,h2,h3,h4,h5,h6,br,section').forEach(el=>{
      el.insertAdjacentText('afterend','␞');
    });
    text = div.textContent || '';
    text = text.replace(/ /g,' ');
    // incidental whitespace/newlines from pretty-printed source markup are not
    // meaningful line breaks - collapse them all before turning our own explicit
    // markers back into real ones.
    text = text.replace(/\s+/g, ' ');
    text = text.replace(/␞/g, '\n');
    text = text.replace(/✦\s*/g, '\n✦ ');
  } else {
    // plain-text paste: real newlines from the source ARE the entry boundaries, so
    // only collapse horizontal whitespace and leave line breaks alone.
    text = raw.replace(/ /g,' ').replace(/\r/g,'');
    text = text.split('\n').map(l=>l.replace(/[ \t]+/g,' ').trim()).join('\n');
  }
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const flat = text.replace(/✦/g,'').replace(/\n/g,' ');

  const name = extractName(flat, lines, isHtml, raw);
  const ac = matchNum(flat, /\b(?:Armor Class|AC)\s*:?\s*(\d+)/i);
  const hp = matchNum(flat, /\b(?:Hit Points|HP)\s*:?\s*(\d+)/i);
  const speedM = /\bSpeed\s*:?\s*([0-9][^.;]*?ft\.?(?:,\s*[A-Za-z]+\s+\d+\s*ft\.?)*)/i.exec(flat);
  const speed = speedM ? speedM[1].trim() : '';
  const crM = /\b(?:Challenge Rating|Challenge|CR)\s*:?\s*([\d/]+)/i.exec(flat);
  const cr = crM ? crM[1] : '';
  const pbM = /\bP(?:roficiency)?\.?\s*B(?:onus)?\.?\s*\+?(\d+)/i.exec(flat);
  const pb = pbM ? +pbM[1] : null;

  const abilities = extractAbilities(flat);

  const saves = {};
  const savesLineM = /Saving Throws?\s*:?\s*([^\n]+)/i.exec(flat);
  if(savesLineM){
    const svRe = /(Str|Dex|Con|Int|Wis|Cha)\w*\s*([+\-−]\s*\d+)/gi;
    let sm;
    while((sm = svRe.exec(savesLineM[1]))) saves[sm[1].slice(0,3).toLowerCase()] = signedInt(sm[2]);
  }
  ABILS.forEach(k=>{ if(saves[k]==null) saves[k] = abilities[k].mod; });

  const SECTIONS = {
    'traits':'trait','trait':'trait',
    'actions':'action','action':'action',
    'bonus actions':'bonus','bonus action':'bonus',
    'reactions':'reaction','reaction':'reaction',
    'legendary actions':'legendary','legendary action':'legendary',
    'lair actions':'legendary','mythic actions':'legendary'
  };
  let currentSection = null;
  const rawEntries = [];
  for(const rawLine of lines){
    const wasBold = /^✦/.test(rawLine);
    const clean = rawLine.replace(/^✦\s*/,'').trim();
    if(!clean) continue;
    const sectionKey = clean.toLowerCase().replace(/[:.]+$/,'').trim();
    if(SECTIONS[sectionKey] && clean.length < 30){ currentSection = SECTIONS[sectionKey]; continue; }
    if(currentSection===null && META_LINE_RE.test(clean)) continue;
    const m = /^([A-Z][A-Za-z0-9()'’.\-\/ ]{1,70}?)\.\s*(.*)$/.exec(clean);
    if(m && (wasBold || currentSection) && m[1].split(' ').length <= 8){
      rawEntries.push({ section: currentSection || 'action', name: m[1].trim(), body: (m[2]||'').trim() });
    } else if(rawEntries.length && currentSection){
      rawEntries[rawEntries.length-1].body += ' ' + clean;
    }
  }

  const entries = rawEntries.map(buildEntry);
  linkMultiattacks(entries);

  return { name, ac, hp, speed, cr, pb, abilities, saves, entries, favourite:false };
}

function blankCreature(){
  return {
    name:'New Creature', ac:null, hp:null, speed:'', cr:'', pb:null,
    abilities: Object.fromEntries(ABILS.map(k=>[k,{score:10,mod:0}])),
    saves: Object.fromEntries(ABILS.map(k=>[k,0])),
    entries: [], favourite:false
  };
}

/* ============================== store (db capability, falls back to localStorage) ============================== */
const Store = (() => {
  let db = null;
  let mode = 'local';
  const listeners = { creatures: [], board: [] };
  const LS_CREATURES = 'er_creatures_v1';
  const LS_BOARD = 'er_board_v1';

  function loadLocalCreatures(){
    try{
      const raw = localStorage.getItem(LS_CREATURES);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    const seed = exampleCreatures();
    try{ localStorage.setItem(LS_CREATURES, JSON.stringify(seed)); }catch(e){}
    return seed;
  }
  function loadLocalBoard(){
    try{
      const raw = localStorage.getItem(LS_BOARD);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { items: [] };
  }

  let localCreatures = loadLocalCreatures();
  let localBoard = loadLocalBoard();

  async function init(){
    try{
      if(window.claude && window.claude.use) db = await window.claude.use('db');
    }catch(e){ db = null; }
    if(db){
      mode = 'db';
      db.collection('creatures').onSnapshot(snap=>{
        const list = snap.docs.map(d=>({ id:d.id, ...d.data() }));
        listeners.creatures.forEach(fn=>fn(list));
      }, err=>console.error('creatures sub', err));
      db.doc('board/state').onSnapshot(snap=>{
        const data = snap.exists ? snap.data() : { items: [] };
        listeners.board.forEach(fn=>fn(data.items ? data : { items: [] }));
      }, err=>console.error('board sub', err));
    } else {
      mode = 'local';
      listeners.creatures.forEach(fn=>fn(localCreatures));
      listeners.board.forEach(fn=>fn(localBoard));
    }
  }

  function onCreatures(fn){ listeners.creatures.push(fn); if(mode==='local') fn(localCreatures); }
  function onBoard(fn){ listeners.board.push(fn); if(mode==='local') fn(localBoard); }

  async function saveCreature(creature){
    if(mode==='db'){
      const ref = creature.id ? db.collection('creatures').doc(creature.id) : db.collection('creatures').doc();
      const { id, ...rest } = creature;
      await ref.set(rest);
      return ref.id;
    } else {
      if(!creature.id) creature.id = uid('c');
      const idx = localCreatures.findIndex(c=>c.id===creature.id);
      if(idx>=0) localCreatures[idx] = creature; else localCreatures.push(creature);
      localStorage.setItem(LS_CREATURES, JSON.stringify(localCreatures));
      listeners.creatures.forEach(fn=>fn(localCreatures));
      return creature.id;
    }
  }

  async function deleteCreature(id){
    if(mode==='db'){
      await db.collection('creatures').doc(id).delete();
    } else {
      localCreatures = localCreatures.filter(c=>c.id!==id);
      localStorage.setItem(LS_CREATURES, JSON.stringify(localCreatures));
      listeners.creatures.forEach(fn=>fn(localCreatures));
    }
  }

  async function setBoard(items){
    if(mode==='db'){
      await db.doc('board/state').set({ items });
    } else {
      localBoard = { items };
      localStorage.setItem(LS_BOARD, JSON.stringify(localBoard));
      listeners.board.forEach(fn=>fn(localBoard));
    }
  }

  return { init, onCreatures, onBoard, saveCreature, deleteCreature, setBoard, get mode(){ return mode; } };
})();

/* ============================== rolling ============================== */
function pushLog(entry){
  entry.id = uid('l');
  entry.time = Date.now();
  log.unshift(entry);
  if(log.length > 200) log.length = 200;
  renderLog();
}

function rollAttackInstance(entry){
  const { rolls, chosen } = rollD20(rollMode);
  const isCrit = chosen === 20;
  const isFumble = chosen === 1;
  const total = isFumble ? chosen : chosen + (entry.toHit||0);
  const dmg = (entry.dmg||[]).map(c=>rollDamage(c, isCrit));
  return { d20rolls: rolls, chosen, toHit: entry.toHit, total, isCrit, isFumble, dmg, extraSave: entry.extraSave };
}

function rollSaveEffectInstance(entry){
  const dmg = (entry.dmg||[]).map(c=>{
    const full = rollDamage(c, false);
    return { ...full, halfTotal: Math.floor(full.total/2) };
  });
  return { dc: entry.save.dc, ability: entry.save.ability, half: entry.save.half, dmg };
}

function rollEntry(creature, entry, times){
  times = clamp(times,1,50);
  if(entry.kind==='multi'){
    const byId = Object.fromEntries(creature.entries.map(e=>[e.id,e]));
    const instances = [];
    for(let i=1;i<=times;i++){
      const subs = [];
      (entry.multi||[]).forEach(part=>{
        const sub = byId[part.ref];
        if(!sub) return;
        for(let j=0;j<part.count;j++){
          if(sub.kind==='attack') subs.push({ name: sub.name, kind:'attack', ...rollAttackInstance(sub) });
          else if(sub.kind==='save') subs.push({ name: sub.name, kind:'save', ...rollSaveEffectInstance(sub) });
        }
      });
      instances.push({ i, kind:'multi', subs });
    }
    pushLog({ creatureName: creature.name, entryName: entry.name, atype: entry.atype, kind:'multi', instances });
    return;
  }
  const instances = [];
  for(let i=1;i<=times;i++){
    if(entry.kind==='attack') instances.push({ i, kind:'attack', ...rollAttackInstance(entry) });
    else if(entry.kind==='save') instances.push({ i, kind:'save', ...rollSaveEffectInstance(entry) });
    else instances.push({ i, kind:'note', text: entry.text });
  }
  pushLog({ creatureName: creature.name, entryName: entry.name, atype: entry.atype, kind: entry.kind, instances });
}

function rollSaveThrow(creature, abil, times){
  times = clamp(times,1,50);
  const mod = (creature.saves && creature.saves[abil]!=null) ? creature.saves[abil] : (creature.abilities[abil]?.mod||0);
  const instances = [];
  for(let i=1;i<=times;i++){
    const { rolls, chosen } = rollD20(rollMode);
    instances.push({ i, kind:'throw', d20rolls: rolls, chosen, mod, total: chosen+mod });
  }
  pushLog({ creatureName: creature.name, entryName: ABIL_FULL[abil]+' Save', atype:'throw', kind:'throw', instances });
}

      </button>
    </div>`;
  }).join('');
}

/* ============================== rendering: board ============================== */
function entryTagText(entry){
  if(entry.kind==='attack'){
    let t = fmtMod(entry.toHit)+' to hit';
    if(entry.dmg && entry.dmg.length) t += ' · ' + entry.dmg.map(d=>d.dice+(d.type?' '+d.type:'')).join(' + ');
    if(entry.extraSave) t += ` · DC ${entry.extraSave.dc} ${entry.extraSave.ability}`;
    return t;
  }
  if(entry.kind==='save'){
    let t = `DC ${entry.save.dc} ${entry.save.ability} save`;
    if(entry.dmg && entry.dmg.length) t += ' · ' + entry.dmg.map(d=>d.dice+(d.type?' '+d.type:'')).join(' + ');
    if(entry.save.half) t += ' (half on success)';
    return t;
  }
  if(entry.kind==='multi') return (entry.multi&&entry.multi.length)? 'Auto-linked '+entry.multi.length+' attack'+(entry.multi.length>1?'s':'') : 'Roll sub-attacks manually below';
  return '';
}

function renderCard(item){
  const c = creatures.find(cr=>cr.id===item.creatureId);
  if(!c) return '';
  const groups = {};
  ATYPE_ORDER.forEach(t=>groups[t]=[]);
  (c.entries||[]).forEach(e=>{ (groups[e.atype]||groups.action).push(e); });

  const savesHtml = ABILS.map(a=>{
    const mod = (c.saves && c.saves[a]!=null) ? c.saves[a] : (c.abilities[a]?.mod||0);
    return `<button class="save-btn" data-act="roll-save" data-board="${item.boardId}" data-abil="${a}" title="Roll ${ABIL_FULL[a]} save">
      <span class="lbl">${a.toUpperCase()}</span><span class="val">${fmtMod(mod)}</span>
    </button>`;
  }).join('');

  const groupsHtml = ATYPE_ORDER.filter(t=>groups[t].length).map(t=>{
    const gid = item.boardId+'-'+t;
    const collapsed = collapsedGroups.has(gid);
    const body = t==='trait'
      ? groups[t].map(e=>`<div class="trait-row"><b>${esc(e.name)}.</b> ${esc(e.text)}</div>`).join('')
      : groups[t].map(e=>{
          const tag = entryTagText(e);
          const btnClass = e.kind==='multi' ? 'multi' : (t==='bonus'?'bonus':t==='reaction'?'reaction':t==='legendary'?'legendary':'');
          return `<div class="entry">
            <div class="entry-main">
              <div class="entry-name">${esc(e.name)}</div>
              ${tag?`<div class="entry-tag">${esc(tag)}</div>`:''}
            </div>
            <button class="roll-btn ${btnClass}" data-act="roll-entry" data-board="${item.boardId}" data-entry="${e.id}" title="Roll">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 3 7.5v9L12 22l9-5.5v-9L12 2Z"/><path d="M12 2v20M3 7.5l9 5.5 9-5.5"/></svg>
              Roll
            </button>
          </div>`;
        }).join('');
    return `<div class="group g-${t} ${collapsed?'collapsed':''}">
      <div class="group-hdr" data-act="toggle-group" data-gid="${gid}">
        <span class="swatch"></span>${ATYPE_LABEL[t]}
        <svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="group-body">${body}</div>
    </div>`;
  }).join('');

  return `<div class="card">
    <div class="card-hdr">
      <div class="card-title-row">
        <div class="card-name">${esc(c.name)}</div>
        <div class="count-stepper">
          <button data-act="count-dec" data-board="${item.boardId}">−</button>
          <span>${item.count}</span>
          <button data-act="count-inc" data-board="${item.boardId}">+</button>
        </div>
        <button class="icobtn" data-act="remove-board" data-board="${item.boardId}" title="Remove from board">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="card-pills">
        ${c.ac?`<span class="pill">AC ${c.ac}</span>`:''}
        ${c.hp?`<span class="pill">HP ${c.hp}</span>`:''}
        ${c.speed?`<span class="pill">${esc(c.speed)}</span>`:''}
        ${c.cr?`<span class="pill">CR ${esc(c.cr)}</span>`:''}
        <span class="count-lbl">× instances</span>
      </div>
    </div>
    <div class="saves-row">${savesHtml}</div>
    ${groupsHtml}
  </div>`;
}

function renderBoard(){
  const el = document.getElementById('board');
  if(!board.items.length){
    el.innerHTML = `<div class="board-empty">No creatures on the board yet.<br><br>Open your <b>library</b> on the left and click a creature (or the + button) to bring it into the encounter.</div>`;
    return;
  }
  el.innerHTML = board.items.map(renderCard).join('');
}

/* ============================== rendering: log ============================== */
function d20Str(inst){
  const rollsStr = inst.d20rolls.length>1 ? `[${inst.d20rolls.join(', ')}]→${inst.chosen}` : `${inst.chosen}`;
  return rollsStr;
}
function dmgStr(dmgArr){
  if(!dmgArr || !dmgArr.length) return '';
  return dmgArr.map(d=>`<span class="dmg-total">${d.total}</span> ${esc(d.type)}`).join(' + ');
}
function dmgHalfStr(dmgArr){
  if(!dmgArr || !dmgArr.length) return '';
  const full = dmgArr.reduce((s,d)=>s+d.total,0);
  const half = dmgArr.reduce((s,d)=>s+d.halfTotal,0);
  return `<span class="dmg-total">${full}</span> full / <span class="dmg-half">${half}</span> half`;
}

function attackCore(inst){
  const crit = inst.isCrit ? ' <span class="crit">CRIT!</span>' : '';
  const fumble = inst.isFumble ? ' <span class="fumble">FUMBLE</span>' : '';
  let line = `d20 ${d20Str(inst)} ${fmtMod(inst.toHit)} = <b>${inst.total}</b>${crit}${fumble}`;
  if(inst.dmg && inst.dmg.length) line += ` — dmg ${dmgStr(inst.dmg)}`;
  if(inst.extraSave) line += `<div class="sub-line">also: DC ${inst.extraSave.dc} ${inst.extraSave.ability} save</div>`;
  return line;
}
function saveCore(inst){
  return `DC ${inst.dc} ${inst.ability} save${inst.half?' (half on success)':''} — ${dmgHalfStr(inst.dmg.map(d=>({...d})))}`;
}
function renderAttackInst(inst){ return `<span class="idx">#${inst.i}</span> ${attackCore(inst)}`; }
function renderSaveInst(inst){ return `<span class="idx">#${inst.i}</span> ${saveCore(inst)}`; }
function renderThrowInst(inst){
  return `<span class="idx">#${inst.i}</span> d20 ${d20Str(inst)} ${fmtMod(inst.mod)} = <b>${inst.total}</b>`;
}
function renderMultiInst(inst){
  const subs = inst.subs.map(s=>{
    const body = s.kind==='attack' ? attackCore(s) : saveCore(s);
    return `<div class="sub-line">${esc(s.name)}: ${body}</div>`;
  }).join('');
  return `<span class="idx">#${inst.i}</span> Multiattack${subs}`;
}

function renderLogCard(entry){
  const cls = entry.kind==='multi' ? 'multi' : (entry.atype==='throw'?'throw':entry.atype);
  const insts = entry.instances.map(inst=>{
    let body;
    if(inst.kind==='attack') body = renderAttackInst(inst);
    else if(inst.kind==='save') body = renderSaveInst(inst);
    else if(inst.kind==='throw') body = renderThrowInst(inst);
    else if(inst.kind==='multi') body = renderMultiInst(inst);
    else body = `<span class="idx">#${inst.i}</span> ${esc(inst.text||'')}`;
    return `<div class="log-inst">${body}</div>`;
  }).join('');
  return `<div class="log-card ${cls}">
    <div class="log-card-hdr">
      <span class="lname">${esc(entry.entryName)}</span>
      <span class="lwho">${esc(entry.creatureName)}</span>
    </div>
    ${insts}
  </div>`;
}

function renderLog(){
  const el = document.getElementById('logList');
  if(!log.length){
    el.innerHTML = `<div class="log-empty">Rolls will appear here.<br>Click any Roll button on a creature's card.</div>`;
    return;
  }
  el.innerHTML = log.map(renderLogCard).join('');
}

function multiRowsHtml(entry, allEntries){

    </div>`).join('') + `<button class="smallbtn" data-act="add-multipart" data-eid="${entry.id}">+ Linked attack</button>`;

/* ============================== event handling ============================== */
function setCreatureField(field, value){
  if(!editingCreature) return;
  if(field==='ac' || field==='hp' || field==='pb') editingCreature[field] = value===''? null : +value;
  else editingCreature[field] = value;
}
function getEntry(id){ return editingCreature.entries.find(e=>e.id===id); }
function setEntryField(eid, field, value){
  const e = getEntry(eid);
  if(!e) return;
  if(field==='toHit') e.toHit = +value;
  else if(field==='save.dc'){ e.save = e.save||{}; e.save.dc = +value; }
  else if(field==='save.ability'){ e.save = e.save||{}; e.save.ability = value; }
  else if(field==='save.half'){ e.save = e.save||{}; e.save.half = value; }
  else e[field] = value;
}
function setDmgField(eid, idx, field, value){
  const e = getEntry(eid);
  if(!e || !e.dmg || !e.dmg[idx]) return;
  e.dmg[idx][field] = value;
}
function setMultiField(eid, idx, field, value){
  const e = getEntry(eid);
  if(!e || !e.multi || !e.multi[idx]) return;
  if(field==='count') e.multi[idx].count = clamp(parseInt(value,10)||1,1,20);
  else e.multi[idx][field] = value;
}

function onGlobalInput(e){
  const t = e.target;
  if(t.id==='searchInput'){ librarySearch = t.value; renderLibrary(); return; }
  if(!editingCreature) return;
  if(t.dataset.cfield){ setCreatureField(t.dataset.cfield, t.value); return; }
  if(t.dataset.abil && t.dataset.abilfield){
    const a = t.dataset.abil, f = t.dataset.abilfield;
    if(f==='score') editingCreature.abilities[a].score = +t.value;
    else if(f==='save') editingCreature.saves[a] = +t.value;
    return;
  }
  if(t.dataset.dfield && t.dataset.eid){ setDmgField(t.dataset.eid, +t.dataset.dmgidx, t.dataset.dfield, t.value); return; }
  if(t.dataset.mfield && t.dataset.eid && t.tagName==='INPUT'){ setMultiField(t.dataset.eid, +t.dataset.midx, t.dataset.mfield, t.value); return; }
  if(t.dataset.efield && t.dataset.eid){ setEntryField(t.dataset.eid, t.dataset.efield, t.value); return; }
}

function onGlobalChange(e){
  const t = e.target;
  if(!editingCreature) return;
  if(t.dataset.efield==='kind' && t.dataset.eid){
    const entry = getEntry(t.dataset.eid);
    entry.kind = t.value;
    if(entry.kind==='attack'){ entry.dmg = entry.dmg||[]; }
    if(entry.kind==='save'){ entry.save = entry.save||{dc:10,ability:'DEX',half:false}; entry.dmg = entry.dmg||[]; }
    if(entry.kind==='multi'){ entry.multi = entry.multi||[]; }
    renderModal();
    return;
  }
  if(t.dataset.mfield==='ref' && t.dataset.eid){ setMultiField(t.dataset.eid, +t.dataset.midx, 'ref', t.value); return; }
  if(t.dataset.efield==='save.half' && t.dataset.eid){ setEntryField(t.dataset.eid, 'save.half', t.checked); return; }
  onGlobalInput(e);
}

function onGlobalClick(e){
  const el = e.target.closest('[data-act]');
  const seg = e.target.closest('#rollModeSeg button');
  if(seg){ rollMode = seg.dataset.mode; document.querySelectorAll('#rollModeSeg button').forEach(b=>b.classList.toggle('active', b===seg)); return; }
  if(!el) return;
  const act = el.dataset.act;

  switch(act){
    case 'toggle-sidebar': document.getElementById('libraryPanel').classList.toggle('open'); document.getElementById('scrim').classList.toggle('show'); break;
    case 'toggle-logpanel': document.getElementById('logPanel').classList.toggle('open'); document.getElementById('scrim').classList.toggle('show'); break;
    case 'clear-log': log = []; renderLog(); break;

    case 'open-add-modal': openAddModal(); break;
    case 'close-modal': closeModal(); break;
    case 'overlay-close': if(e.target===el) closeModal(); break;
    case 'start-blank': editingCreature = blankCreature(); modalMode='edit'; renderModal(); break;
    case 'parse-statblock': {
      const raw = document.getElementById('pasteArea').value;
      if(!raw.trim()){ editingCreature = blankCreature(); } else { editingCreature = parseStatblock(raw); }
      modalMode = 'edit'; renderModal();
      break;
    }
    case 'save-creature': {
      if(!editingCreature.name || !editingCreature.name.trim()) editingCreature.name = 'Unnamed Creature';
      Store.saveCreature(editingCreature);
      closeModal();
      break;
    }
    case 'add-entry': {
      editingCreature.entries.push({ id: uid('e'), name:'New Entry', atype: el.dataset.atype, kind:'other', dmg:[], text:'' });
      renderModal();
      break;
    }
    case 'remove-entry': editingCreature.entries = editingCreature.entries.filter(x=>x.id!==el.dataset.eid); renderModal(); break;
    case 'add-dmg': { const en = getEntry(el.dataset.eid); en.dmg = en.dmg||[]; en.dmg.push({dice:'1d6',type:''}); renderModal(); break; }
    case 'remove-dmg': { const en = getEntry(el.dataset.eid); en.dmg.splice(+el.dataset.dmgidx,1); renderModal(); break; }
    case 'add-multipart': { const en = getEntry(el.dataset.eid); en.multi = en.multi||[]; en.multi.push({ref:'',count:1}); renderModal(); break; }
    case 'remove-multipart': { const en = getEntry(el.dataset.eid); en.multi.splice(+el.dataset.midx,1); renderModal(); break; }

    case 'toggle-fav': {
      const c = creatures.find(x=>x.id===el.dataset.creature);
      if(c){ c.favourite = !c.favourite; Store.saveCreature(c); }
      break;
    }
    case 'edit-creature': { const c = creatures.find(x=>x.id===el.dataset.creature); if(c) openEditModal(c); break; }
    case 'delete-creature': {
      const c = creatures.find(x=>x.id===el.dataset.creature);
      if(c && confirm(`Delete "${c.name}" from your library? This can't be undone.`)){
        Store.deleteCreature(c.id);
        Store.setBoard(board.items.filter(it=>it.creatureId!==c.id));
      }
      break;
    }
    case 'add-board': {
      const items = board.items.slice();
      items.push({ boardId: uid('b'), creatureId: el.dataset.creature, count: 1 });
      Store.setBoard(items);
      break;
    }
    case 'remove-board': Store.setBoard(board.items.filter(it=>it.boardId!==el.dataset.board)); break;
    case 'count-inc': {
      const items = board.items.map(it=> it.boardId===el.dataset.board ? {...it, count: clamp(it.count+1,1,50)} : it);
      Store.setBoard(items);
      break;
    }
    case 'count-dec': {
      const items = board.items.map(it=> it.boardId===el.dataset.board ? {...it, count: clamp(it.count-1,1,50)} : it);
      Store.setBoard(items);
      break;
    }
    case 'toggle-group': {
      const gid = el.dataset.gid;
      if(collapsedGroups.has(gid)) collapsedGroups.delete(gid); else collapsedGroups.add(gid);
      renderBoard();
      break;
    }
    case 'roll-entry': {
      const item = board.items.find(it=>it.boardId===el.dataset.board);
      const c = item && creatures.find(cr=>cr.id===item.creatureId);
      const entry = c && c.entries.find(en=>en.id===el.dataset.entry);
      if(c && entry) rollEntry(c, entry, item.count);
      break;
    }
    case 'roll-save': {
      const item = board.items.find(it=>it.boardId===el.dataset.board);
      const c = item && creatures.find(cr=>cr.id===item.creatureId);
      if(c) rollSaveThrow(c, el.dataset.abil, item.count);
      break;
    }
  }
}

document.addEventListener('click', onGlobalClick);
document.addEventListener('input', onGlobalInput);
document.addEventListener('change', onGlobalChange);
document.getElementById('scrim').addEventListener('click', ()=>{
  document.getElementById('libraryPanel').classList.remove('open');
  document.getElementById('logPanel').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
});

/* ============================== init ============================== */
Store.onCreatures(list=>{ creatures = list; renderLibrary(); renderBoard(); });
Store.onBoard(data=>{ board = data && data.items ? data : { items: [] }; renderBoard(); renderLibrary(); });
Store.init();
renderLog();
</script>
